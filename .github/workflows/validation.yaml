name: validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "R/**"
      - "tests/**"
      - "man/**"
      - "NAMESPACE"
      - "DESCRIPTION"
      - ".github/workflows/validation.yaml"
  workflow_dispatch:

jobs:
  testthat:
    runs-on: ubuntu-latest
    concurrency:
      group: validation-testthat-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true

    # An ephemeral, per-run MySQL instance -- SigRepo's own testthat suite
    # used to run against a shared, long-lived server (sigrepo.org) via the
    # hardcoded SigRepo::test_conn_handler credentials. That meant every push
    # and PR mutated shared state (concurrent runs could race each other's
    # inserts/deletes) and shipped a working DB password in package source.
    # Booting a throwaway MySQL + SigRepo_Server API stack per run and
    # pointing test_conn_handler at it via SIGREPO_TEST_* env vars (see
    # R/test_conn_handler.R, R/zzz.R) removes both problems without touching
    # any test file.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sigrepo
          MYSQL_ROOT_PASSWORD: sigrepo
          # Without these the mysql image never provisions the `montilab`
          # login that SIGREPO_TEST_DB_USER below (and test_conn_handler)
          # expects -- the test suite would fail to connect at all.
          MYSQL_USER: montilab
          MYSQL_PASSWORD: sigrepo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -psigrepo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DB_NAME: sigrepo
      DB_HOST: 127.0.0.1
      DB_LOCAL_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: sigrepo
      ADMIN_KEY: ci-test-admin-key
      SENDMAIL_KEY: ci-test-sendmail-key
      DIFEXP_DIR: ${{ github.workspace }}/tmp_ci_difexp
      SIGREPO_SERVER_DIR: ${{ github.workspace }}/external/SigRepo_Server
      SIGREPO_DIR: ${{ github.workspace }}
      # Consumed by R/test_conn_handler.R via the active binding installed
      # in R/zzz.R's .onLoad(): overrides SigRepo::test_conn_handler so the
      # test suite talks to the ephemeral stack above instead of sigrepo.org.
      SIGREPO_TEST_DB_NAME: sigrepo
      SIGREPO_TEST_DB_HOST: 127.0.0.1
      SIGREPO_TEST_DB_PORT: 3306
      SIGREPO_TEST_DB_USER: montilab
      SIGREPO_TEST_DB_PASSWORD: sigrepo
      SIGREPO_TEST_API_HOST: http://127.0.0.1
      SIGREPO_TEST_API_PORT: 3838

    steps:
      - name: Checkout SigRepo (client package under test)
        uses: actions/checkout@v4

      - name: Checkout SigRepo_Server
        uses: actions/checkout@v4
        with:
          repository: montilab/SigRepo_Server
          path: external/SigRepo_Server

      - name: Install system dependencies
        run: |
          sudo apt-get update --allow-releaseinfo-change --fix-missing
          sudo apt-get -y --no-install-recommends install \
            build-essential pkg-config cmake \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            default-libmysqlclient-dev librsvg2-dev libudunits2-dev \
            libv8-dev libsodium-dev libbz2-dev liblzma-dev \
            tcl8.6-dev tk8.6-dev libabsl-dev libuv1-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
            any::covr
            local::.
            github::montilab/hypeR-GEM
          needs: |
            test
            coverage

      - name: Install SigRepo_Server's R dependencies
        working-directory: external/SigRepo_Server
        run: Rscript install_r_packages.R

      - name: Install Bioconductor dependencies (limma, biomaRt)
        run: |
          Rscript -e 'BiocManager::install(c("limma", "biomaRt"), ask = FALSE, update = FALSE)'

      - name: Boot SigRepo_Server's Plumber API against the ephemeral MySQL
        working-directory: external/SigRepo_Server
        run: |
          mkdir -p "${DIFEXP_DIR}"
          Rscript api/run_sigrepo_api.R > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3838/__docs__/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3838/__docs__/ >/dev/null

      - name: Initialize schema and reference data via /init_db
        run: |
          curl -fsS -X POST "http://127.0.0.1:3838/init_db?admin_key=${ADMIN_KEY}"

      - name: Run testthat with coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/api.log || true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: ignore

  roxygen-consistency:
    runs-on: ubuntu-latest
    concurrency:
      group: validation-roxygen-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::roxygen2
            local::.
            github::montilab/hypeR-GEM
          needs: roxygen2

      - name: Regenerate documentation
        run: devtools::document()
        shell: Rscript {0}

      - name: Check for documentation drift
        run: git diff --exit-code -- NAMESPACE man
