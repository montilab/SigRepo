name: validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "R/**"
      - "tests/**"
      - "man/**"
      - "NAMESPACE"
      - "DESCRIPTION"
      - ".github/workflows/validation.yaml"
  workflow_dispatch:

jobs:
  testthat:
    runs-on: ubuntu-latest
    concurrency:
      group: validation-testthat-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
            local::.
          needs: test

      - name: Run testthat
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}

  roxygen-consistency:
    runs-on: ubuntu-latest
    concurrency:
      group: validation-roxygen-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::roxygen2
            local::.
          needs: roxygen2

      - name: Regenerate documentation
        run: devtools::document()
        shell: Rscript {0}

      - name: Check for documentation drift
        run: git diff --exit-code -- NAMESPACE man
