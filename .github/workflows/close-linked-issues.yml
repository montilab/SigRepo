name: close-linked-issues

on:
  # pull_request_target, not pull_request: the job needs a token that can close
  # issues, and it never checks out or runs the pull request's code, so the
  # usual risk of that trigger does not apply.
  pull_request_target:
    types: [closed]
    # GitHub honours `Closes #NNN` only when a pull request merges into the
    # default branch, which is master. Pull requests target dev, so without
    # this job the keyword does nothing until a release carries dev into
    # master, and every issue resolved in between sits open on the board.
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Keywords inside HTML comments and code are not instructions.
            const body = (pr.body || '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/```[\s\S]*?```/g, '')
              .replace(/`[^`\n]*`/g, '');

            // The same keywords GitHub recognises, followed by #N, owner/repo#N
            // or an issue URL.
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+(?:([\w.-]+\/[\w.-]+)?#(\d+)|https:\/\/github\.com\/([\w.-]+\/[\w.-]+)\/issues\/(\d+))/gi;

            const numbers = new Set();
            for (const m of body.matchAll(pattern)) {
              const target = (m[1] || m[3] || `${owner}/${repo}`).toLowerCase();
              const number = Number(m[2] || m[4]);
              if (target !== `${owner}/${repo}`.toLowerCase()) {
                // This job's token reaches this repository only.
                core.warning(`${target}#${number} is in another repository; close it by hand.`);
                continue;
              }
              numbers.add(number);
            }

            if (numbers.size === 0) {
              core.info(`#${pr.number} names no issue to close.`);
              return;
            }

            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request || issue.state === 'closed') {
                core.info(`#${issue_number} skipped: ${issue.pull_request ? 'a pull request' : 'already closed'}.`);
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `Closed by #${pr.number}, merged into \`${pr.base.ref}\`.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`#${issue_number} closed.`);
            }
