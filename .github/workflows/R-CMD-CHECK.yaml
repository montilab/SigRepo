# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [master, dev]
    paths-ignore:
      - '.github/workflows/document.yaml'
      - '.github/workflows/gh-pages-pkgdown.yaml'
      - '.github/workflows/pkgdown.yaml'
      - '.github/workflows/render-news-rmd.yaml'
      - '.github/workflows/render-render-rmd.yaml'
      - '**.Rmd'
      - '.gitignore'
  pull_request:
    branches: [master, dev]
  release:
    types: [published]
  workflow_dispatch:
      
name: rcmdcheck

jobs:
  rcmdcheck:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: rcmdcheck-${{ matrix.config.os }}-${{ matrix.config.r }}-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, r: 'release' }
          - { os: macos-latest, r: 'release' }
          - { os: ubuntu-latest, r: 'devel', http-user-agent: 'release' }
          - { os: ubuntu-latest, r: 'release' }
          - { os: ubuntu-latest, r: 'oldrel-1' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # test_conn_handler defaults host to sigrepo.org and api_host to the
      # production IP. Nothing here reaches production today: this check supplies
      # no SIGREPO_TEST_DB_USER or _PASSWORD, runs with --no-tests --no-examples,
      # and every @examples block is wrapped in \dontrun. Pin the hosts anyway, so
      # that stays true if credentials are ever added to this workflow.
      SIGREPO_TEST_DB_HOST: 127.0.0.1
      SIGREPO_TEST_API_HOST: http://127.0.0.1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_DOCS }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, github::montilab/hypeR-GEM
          needs: check

      - name: Run R-CMD-CHECK
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran", "--no-tests", "--no-examples")'
          upload-snapshots: true
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          DISPLAY: 99.0
