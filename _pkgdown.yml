url: https://montilab.github.io/SigRepo/

development:
  mode: auto

template:
  bootstrap: 5
  bootswatch: lux
  light-switch: true
  includes:
    in_header: <link rel="stylesheet" type="text/css" href="https://..." />

authors:
  Reina Chau:
    href: https://github.com/RC-88
  Cameron Vicnaire:
    href: https://github.com/Cvicnaire
  Vanessa Li:
    href: https://github.com/katgit
  Stefano Monti:
    href: https://github.com/tetomonti

news:
  one_page: false
  
reference:
  - title: Connect to Database
    desc: ~
    contents:
      - '`newConnHandler`'
  
  - title: Search Data in Database
    desc: ~
    contents:
      - '`searchSignature`'
      - '`searchCollection`'
      - '`searchTranscriptomicsFeatureSet`'
      - '`searchProteomicsFeatureSet`'
      - '`searchSampleTypes`'
      - '`searchOrganisms`'
      - '`searchPhenotypes`'
      - '`searchPlatforms`'
      - '`searchUser`'
    
  - title: Retrieve Data from Database
    desc: ~
    contents:
      - '`getSignature`'
      - '`getCollection`'
      - '`getAPIKey`'

  - title: Import Data to Database
    desc: ~
    contents:
      - '`addSignature`'
      - '`addUserToSignature`'
      - '`addCollection`'
      - '`addUserToCollection`'
      - '`addSignatureToCollection`'
      - '`addProteomicsFeatureSet`'
      - '`addProteomicsSignatureSet`'
      - '`addTranscriptomicsFeatureSet`'
      - '`addTranscriptomicsSignatureSet`'
      - '`addSampleType`'
      - '`addOrganism`'
      - '`addPhenotype`'
      - '`addPlatform`'
      - '`addKeyword`'
      - '`addUser`'
  
  - title: Update Data in Database
    desc: ~
    contents:
      - '`updateSignature`'
      - '`updateCollectionMetadata`'
      - '`updateUser`'
  
  - title: Delete Data from Database
    desc: ~
    contents:
      - '`deleteSignature`'
      - '`deleteCollection`'
      - '`removeSignatureFromCollection`'
      - '`deleteSampleType`'
      - '`deleteOrganism`'
      - '`deletePhenotype`'
      - '`deletePlatform`'
      - '`deleteUser`'
      - '`inActivateUser`'

navbar:
  title: SigRepo
  structure:
    left: [signature, collection, reference, change_log]
    right: [search, github, lightswitch]
  components:
    signature:
      text: "Upload Signature"
      href: index.html
    collection:
      text: "Upload Collection"
      href: articles/collection-tutorials.html        
    reference:
      text: "Reference"
      href: reference/index.html 
    change_log:
      text: "Change Log"
      href: news/index.html
    github:
      icon: fa-github
      aria-label: "GitHub Icon"
      href: https://github.com/montilab/SigRepo  

footer:
  structure: 
    left: developed_by
    right: built_with
    
    